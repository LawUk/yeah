<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estación de ensamble MDF · Vista 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <h1>Estación de ensamble MDF</h1>

  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">
    Vista 3D con zoom de una estación de ensamble asistida en MDF: mesa con ocho bins con sensores,
    nido de ensamble, cámara sobre el nido, monitor, tablet, lector RFID, caja ESP32,
    CPU y franja Andon.
  </h2>

  <div id="wrap" class="viewer">
    <span class="key-hint">Presiona F → isométrico</span>
  </div>

  <div class="controls">
    <div class="grp">
      <span class="glab">Vista</span>
      <div class="seg">
        <button type="button" class="active" data-view="gen">General</button>
        <button type="button" data-view="work">Trabajo</button>
        <button type="button" data-view="scr">Pantallas</button>
        <button type="button" data-view="under">Bajo mesa</button>
        <button type="button" data-view="top">Arriba</button>
      </div>
    </div>

    <div class="grp">
      <span class="glab">Zoom</span>
      <div class="seg">
        <button type="button" data-zoom="0.82" aria-label="Acercar"><span class="icon">+</span></button>
        <button type="button" data-zoom="1.22" aria-label="Alejar"><span class="icon">−</span></button>
      </div>
    </div>

    <div class="grp">
      <span class="glab">Andon</span>
      <div class="seg">
        <button type="button" data-andon="34c759"><i class="dot" style="background:#34c759"></i>Verde</button>
        <button type="button" data-andon="ff9f0a"><i class="dot" style="background:#ff9f0a"></i>Ámbar</button>
        <button type="button" data-andon="ff3b30"><i class="dot" style="background:#ff3b30"></i>Rojo</button>
      </div>
    </div>

    <div class="grp">
      <span class="glab">Mostrar</span>
      <div class="seg">
        <button type="button" class="active" id="lblBtn">Etiquetas</button>
      </div>
    </div>
  </div>

  <div id="legendContainer" class="legend"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
